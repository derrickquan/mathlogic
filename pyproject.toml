[project]
name = "mathlogic-curriculum"
version = "0.1.0"
description = "Deterministic curriculum authoring for MathLogic"
requires-python = ">=3.11"

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "psycopg[binary,pool]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs a PostgreSQL server binary; skipped where there is none",
]

[tool.ruff]
line-length = 100
